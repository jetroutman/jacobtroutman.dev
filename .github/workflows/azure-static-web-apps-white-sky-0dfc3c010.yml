name: Azure Static Web Apps CI/CD

on:
  # Daily rebuild so Notion edits (books, notes, posts, case files, company pages) show up on their own (08:17 UTC).
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
      # Build here with a current Node: Azure's Oryx builder lags behind Astro's minimum.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Library: pull Published books from Notion. Without the secret, the committed snapshot is used.
      - run: node scripts/sync-library.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Notes: the Slip Box (everything not marked Private). Runs after the library so book links resolve.
      - run: node scripts/sync-notes.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Posts: every status is synced; only Published get public pages, the rest play under /admin/ (admin role only).
      - run: node scripts/sync-posts.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Case files (Decision Log) and company pages: Notion → src/data/cases.json + companies.json.
      - run: node scripts/sync-site-pages.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Tracking API: tested here so a broken API never reaches the deploy step.
      - run: node scripts/write-api-companies.mjs
      - run: npm ci && npm test && npm run build
        working-directory: api
      - run: npm run build
        env:
          # PR previews also build draft company pages and "Before launch" notes. Production never does.
          PUBLIC_DRAFTS: ${{ github.event_name == 'pull_request' }}
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_0DFC3C010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          skip_app_build: true
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Prebuilt site (staticwebapp.config.json is copied in from public/)
          api_location: "api" # Azure reinstalls and rebuilds it; there's no input to skip that
          output_location: ""
          ###### End of Repository/Build Configurations ######
      # The API answers 204 to anything once it's up, and 404 if the deploy didn't bring it up.
      - name: Check the tracking API
        env:
          SITE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST -d '{}' "$SITE_URL/api/track" || true)
            echo "[api] attempt $i: $code"
            [ "$code" = 204 ] && exit 0
            sleep 10
          done
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_0DFC3C010 }}
          action: "close"
