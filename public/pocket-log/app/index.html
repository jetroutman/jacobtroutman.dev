<script>
/* jacobtroutman.dev embed bridge: theme follows the site, height and scroll are handed to the parent page. */
(function(){
  const root=document.documentElement;
  const theme=()=>{try{const t=localStorage.getItem('jt-theme');if(t)root.dataset.theme=t;else delete root.dataset.theme}catch(e){}};
  theme();addEventListener('storage',e=>{if(e.key==='jt-theme')theme()});
  const embedded=window.parent!==window;
  window.plPost=m=>{if(embedded)parent.postMessage({src:'pocket-log',...m},location.origin)};
  if(embedded){
    const send=()=>plPost({type:'height',h:Math.ceil(document.documentElement.scrollHeight)});
    addEventListener('load',send);new ResizeObserver(send).observe(document.documentElement);
    const sc=window.scrollTo.bind(window);window.scrollTo=(...a)=>{plPost({type:'top'});sc(...a)};
  }
})();
</script>

/* Each person's log lives in their own private space: data/users/<id>/profile (settings) and its games subcollection. */
let uid=null;const profileDoc=()=>db.doc(`data/users/${uid}/profile`),gamesCol=()=>profileDoc().collection('games');
let cache={games:{},dirty:[],deleted:[],settings:null,settingsDirty:false,plans:{},plansDirty:[]},flushing=false;
const plansCol=()=>profileDoc().collection('coaching');
function saveLocal(){if(state.mode==='real')return;try{localStorage.setItem(LS,JSON.stringify(cache))}catch(e){}}
let SNAP=null;
function fromSnap(){state.games=clone(SNAP.games);state.settings={...DEF,...clone(SNAP.settings)};cache={games:{},dirty:[],deleted:[],settings:null,settingsDirty:false,plans:clone(SNAP.plans||{}),plansDirty:[]};state.games.forEach(g=>cache.games[g.id]=clone(g))}
function readOnly(){fromSnap();state.draft=null;state.fedit=null;state.metaEdit=null;state.roMsg='This is my real league data, so it’s read-only. Switch to Sandbox to try that.';plPost({type:'readonly'});render();window.scrollTo(0,0);return true}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){
  if(Array.isArray(d.games)){d.games.forEach(g=>cache.games[g.id]=g);cache.dirty=d.games.map(g=>g.id);if(d.settings){cache.settings=d.settings;cache.settingsDirty=true}}
  else cache={...cache,...d,games:d.games||{},dirty:d.dirty||[],deleted:d.deleted||[]}}}catch(e){}
 state.games=Object.values(cache.games).map(clone);if(cache.settings)state.settings={...DEF,...cache.settings}}
const pendingCount=()=>cache.dirty.length+cache.deleted.length+(cache.settingsDirty?1:0)+((cache.plansDirty||[]).length);
function failed(e){state.syncErr=(e&&e.code==='quota_exceeded')?'Your log is full. Delete some old games to keep saving.':'';render()}
function persist(g){if(state.mode==='real'){readOnly();return}g.updatedAt=new Date().toISOString();const i=state.games.findIndex(x=>x.id===g.id);if(i<0)state.games.push(g);else state.games[i]=g;
 cache.games[g.id]=clone(g);if(!cache.dirty.includes(g.id))cache.dirty.push(g.id);saveLocal();flush()}
function remove(id){if(state.mode==='real'){readOnly();return}state.games=state.games.filter(g=>g.id!==id);delete cache.games[id];cache.dirty=cache.dirty.filter(x=>x!==id);if(!cache.deleted.includes(id))cache.deleted.push(id);saveLocal();flush()}
function saveSettings(){if(state.mode==='real'){readOnly();return}cache.settings=clone(state.settings);cache.settingsDirty=true;saveLocal();flush()}
async function flush(){if(!db||flushing)return;flushing=true;
 try{
  while(cache.deleted.length){const id=cache.deleted[0];await gamesCol().doc(id).delete();cache.deleted=cache.deleted.filter(x=>x!==id);saveLocal()}
  while(cache.dirty.length){const id=cache.dirty[0],g=cache.games[id];if(!g){cache.dirty.shift();continue}const sent=g.updatedAt;
   await gamesCol().doc(id).set(clone(g));if(!cache.games[id]||cache.games[id].updatedAt===sent)cache.dirty=cache.dirty.filter(x=>x!==id);saveLocal()}
  if(cache.settingsDirty){await profileDoc().set(clone(cache.settings));cache.settingsDirty=false;saveLocal()}
  while((cache.plansDirty||[]).length){const id=cache.plansDirty[0],pl=cache.plans[id];if(pl)await plansCol().doc(id).set(clone(pl));cache.plansDirty=cache.plansDirty.filter(x=>x!==id);saveLocal()}
  state.offline=false;state.syncErr=''}
 catch(e){if(e&&e.code==='quota_exceeded')failed(e);else state.offline=true}
 flushing=false;render()}
function onRemote(snap){const remote={};snap.docs.forEach(x=>{remote[x.id]={...clone(x.data()),id:x.id}});
 cache.dirty.slice().forEach(id=>{const l=cache.games[id],r=remote[id];if(l&&r&&(r.updatedAt||'')>(l.updatedAt||''))cache.dirty=cache.dirty.filter(x=>x!==id)});
 const merged={...remote};cache.dirty.forEach(id=>{if(cache.games[id])merged[id]=cache.games[id]});cache.deleted.forEach(id=>delete merged[id]);
 cache.games=merged;state.games=Object.values(merged).map(clone);state.loaded=true;state.offline=false;saveLocal();render();flush()}

/* ---------- helpers ---------- */
const active=()=>state.games.find(g=>g.status==='active');
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const gameDate=g=>g.date||(g.startedAt?ymd(new Date(g.startedAt)):'');
const done=()=>state.games.filter(g=>g.status==='done').sort((a,b)=>(gameDate(b)+(b.startedAt||'')).localeCompare(gameDate(a)+(a.startedAt||'')));
const fmtDate=g=>{const d=gameDate(g);if(!d)return '';try{return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}catch(e){return d}};
const where=g=>[g.center||'',g.lane?'Lane '+g.lane:''].filter(Boolean).join(' · ');
const ballsUsed=()=>[...new Set(state.games.map(g=>g.ball).filter(Boolean))];
function prefill(g,fresh){const scan=gm=>{for(let fi=9;fi>=0;fi--){const info=ballsInfo(gm.frames[fi]);for(let j=info.length-1;j>=0;j--){const b=info[j];if(b.fresh===fresh&&b.st!=null)return {st:b.st,tg:b.tg}}}return null};
 return (g&&scan(g))||done().map(scan).find(Boolean)||(fresh?{st:22,tg:12}:{st:null,tg:null})}
function blankDraft(key,rack,fresh,p){return {key,rack,fresh,standing:[],st:p.st,tg:p.tg,ball:p.ball||null,auto:true,markAuto:true,mark:'unsure',by:2,miss:null,sp:null}}
function ensureDraft(g,nb){const key=`${g.id}:${nb.fi}:${nb.bi}`;if(state.draft&&state.draft.key===key)return state.draft;
 const ball=defaultBall(g,nb),gear=nb.fresh?lastGear(g):null,sg=suggest(g,nb,ball,gear);state.draft=blankDraft(key,nb.rack,nb.fresh,sg?{st:sg.st,tg:sg.tg,ball}:{...prefill(g,nb.fresh),ball});
 state.draft.gear=gear;state.draft.gearCarried=!!gear;return state.draft}
function lastGear(g){const se=sessOf(g),games=se?se.games:[g];for(let i=games.length-1;i>=0;i--){const gm=games[i].id===g.id?g:games[i];
 for(let fi=9;fi>=0;fi--){const info=ballsInfo(gm.frames[fi]);for(let j=info.length-1;j>=0;j--){const b=info[j];if(b.fresh&&b.gear!==undefined)return b.gear||null}}}return null}
/* ---------- ideal shot: learned strike line per ball + your spare system ---------- */
const ROW={1:0,2:1,3:1,4:2,5:2,6:2,7:3,8:3,9:3,10:3};
const MOVE={2:3,8:3,4:6,7:9,3:-2,9:-2,6:-4,10:-6};
const ballOf=(b,g)=>b.ball||g.ball||'';
const spareBallName=()=>(arsenal().find(b=>b.use==='spare')||{}).name||'Spare ball';
function keyPin(r){return r.slice().sort((a,b)=>ROW[a]-ROW[b]||Math.abs(MOVE[b]||0)-Math.abs(MOVE[a]||0))[0]}
function spareRule(p){const o=(state.settings.spare||{})[p];return o&&(o.st!=null||o.ball)?o:null}
function defaultBall(g,c){if(c.fresh)return g.ball||null;const h=hand(g),kp=keyPin(toR(c.rack,h)),p=h==='L'?MIR[kp]:kp,o=spareRule(p);return o&&o.ball==='spare'?spareBallName():(g.ball||null)}
function allShots(){const out=[];state.games.slice().sort((a,b)=>(gameDate(a)+(a.startedAt||'')).localeCompare(gameDate(b)+(b.startedAt||''))).forEach(g=>g.frames.forEach((f,fi)=>ballsInfo(f).forEach((b,j)=>out.push({...b,g,fi,j,ball:ballOf(b,g)}))));return out}
function strikeLine(ball,gear){let shots=allShots().filter(b=>b.fresh&&b.st!=null&&b.tg!=null&&(!ball||b.ball===ball));if(gear){const sg=shots.filter(b=>b.gear===gear);if(sg.length<2)return null;shots=sg}shots=shots.slice(-40);if(!shots.length)return null;const grp={};
 shots.forEach((b,i)=>{const k=b.st+'|'+b.tg,x=grp[k]||(grp[k]={st:b.st,tg:b.tg,n:0,x:0,last:0});x.n++;if(!b.standing.length)x.x++;x.last=i});
 return Object.values(grp).sort((a,b)=>b.x-a.x||b.last-a.last)[0]}
function spareHistory(rackKey){const grp={};allShots().filter(b=>!b.fresh&&b.st!=null&&keyOf(b.rack)===rackKey).forEach(b=>{const k=`${b.st}|${b.tg}|${b.ball}`,x=grp[k]||(grp[k]={st:b.st,tg:b.tg,ball:b.ball,n:0,m:0});x.n++;if(!b.standing.length)x.m++});
 return Object.values(grp).sort((a,b)=>b.m-a.m||b.n-a.n)[0]||null}
function suggest(g,c,ball,gear){const h=hand(g);
 if(c.fresh){const sp=n=>n==='slow'?'slower':'faster',dirTxt=sg=>(sg>0)===(h==='R')?'left':'right',aimMiss=b=>(b.mark==='left'||b.mark==='right')&&!b.markPred;
  /* Tonight first: the line you're playing right now beats last week's history. */
  const se=sessOf(g),night=(se?se.games:[g]).flatMap(gm=>firstBalls(gm.id===g.id?g:gm).map(b=>({...b,ball:ballOf(b,gm)}))).filter(b=>b.st!=null&&b.tg!=null&&(!ball||b.ball===ball));
  if(night.length){const A=nightAdjust(g,ball);if(A)return {st:A.st,tg:A.tg,ball:A.kind==='ball'?A.ball:undefined,gear:A.kind==='speed'?A.gear:undefined,why:`${A.record} ${A.text}`}}
  const LG=gear&&strikeLine(ball,gear),L=LG||strikeLine(ball)||strikeLine(null);if(!L)return null;
  return {st:L.st,tg:L.tg,why:`${ball?ball+' strike line':'Your strike line'}${LG?` at your ${sp(gear)} speed`:''}: struck ${L.x} of ${L.n} from ${L.st} → ${L.tg}. Starts here until you throw a ball tonight.`}}
 const r=toR(c.rack,h),kp=keyPin(r),p=h==='L'?MIR[kp]:kp,o=spareRule(p),H=spareHistory(keyOf(c.rack));
 const hist=H&&H.m?`You've made ${leaveName(c.rack)} ${H.m} of ${H.n} from ${H.st} → ${H.tg}${H.ball?' with '+H.ball:''}.`:H?`Missed ${leaveName(c.rack)} ${H.n} time${H.n>1?'s':''} from ${H.st} → ${H.tg}.`:'';
 if(o&&o.st!=null)return {st:o.st,tg:o.tg,why:`Your ${p} pin shot${o.ball==='spare'?' with your spare ball':''}.${c.rack.length>1?` Key pin is the ${p}.`:''}`,hist};
 const base=strikeLine(g.ball||null)||strikeLine(null)||{st:20,tg:12},mv=MOVE[kp]||0,dir=(mv>0)===(h==='R')?'right':'left';
 return {st:Math.min(45,Math.max(1,base.st-mv)),tg:base.tg,why:mv?`${Math.abs(mv)} boards ${dir} of your strike line (${base.st} → ${base.tg}), same target. ${Math.abs(mv)===3||Math.abs(mv)===6||Math.abs(mv)===9?'3-6-9':'2-4-6'} for the ${p}.`:`Your strike line, same target. The ${p} is right behind the pocket.`,hist}}
function firstBalls(g){const out=[];g.frames.forEach((f,fi)=>ballsInfo(f).forEach((b,j)=>{if(b.fresh)out.push({...b,fi,j})}));return out}
function makeBall(d,h){let ax=null;if(d.tg!=null){if(d.mark==='yes'&&!d.markAuto)ax=d.tg;}
 return {standing:d.standing.filter(p=>d.rack.includes(p)).sort((x,y)=>x-y),st:d.st??null,tg:d.tg??null,ax,mark:d.tg!=null?d.mark:null,by:null,miss:(d.mark==='left'||d.mark==='right')?(d.miss||null):null,sp:d.sp||null,gear:d.fresh?(d.gear||null):undefined,ball:d.ball||null,markPred:!!(d.fresh&&d.markAuto&&d.tg!=null&&d.st!=null)}}
/* Frame editing: re-enter one frame ball by ball, each ball prefilled from what was saved. */
function editCtx(){const fe=state.fedit;if(!fe)return null;const g=state.games.find(x=>x.id===fe.id);if(!g)return null;
 const info=ballsInfo({balls:fe.balls}),last=info[info.length-1],fresh=!last||last.standing.length===0,rack=fresh?ALL.slice():last.standing.slice(),bi=fe.balls.length,key=`edit:${g.id}:${fe.fi}:${bi}`;
 if(!state.draft||state.draft.key!==key){const o=g.frames[fe.fi].balls[bi],oi=ballsInfo(g.frames[fe.fi])[bi];const d=blankDraft(key,rack,fresh,o?{st:o.st,tg:o.tg}:prefill(g,fresh));
  if(o){if(oi&&keyOf(oi.rack)===keyOf(rack))d.standing=o.standing.slice();d.mark=o.mark||(o.ax!=null?'yes':'unsure');d.by=o.by||2;d.miss=o.miss!==undefined?o.miss:(o.by!=null?(o.by<=2?'1-2':o.by<=4?'3-4':'5+'):null);d.markAuto=!!o.markPred;d.sp=o.sp||null;d.gear=o.gear||null;d.ball=o.ball||g.ball||null;d.auto=false}
  state.draft=d}
 return {g,fi:fe.fi,bi,rack,fresh}}

/* ---------- nights: games on the same date, type and center form one session (league series, practice) ---------- */
const TYPES=[['league','League'],['practice','Practice'],['open','Open play']];
const gameType=g=>g.type||'open';
const typeLabel=t=>(TYPES.find(x=>x[0]===t)||TYPES[2])[1];
const sessKey=g=>`${gameDate(g)}|${gameType(g)}|${(g.center||'').trim().toLowerCase()}`;
function sessions(){const m={};state.games.slice().sort((a,b)=>(a.startedAt||'').localeCompare(b.startedAt||'')).forEach(g=>{const k=sessKey(g);(m[k]=m[k]||{key:k,date:gameDate(g),type:gameType(g),center:g.center||'',lanes:new Set(),games:[]}).games.push(g);if(g.lane)m[k].lanes.add(g.lane)});
 return Object.values(m).sort((a,b)=>(b.date+b.games[b.games.length-1].startedAt).localeCompare(a.date+a.games[a.games.length-1].startedAt))}
const sessOf=g=>sessions().find(x=>x.key===sessKey(g));
const gameNo=g=>{const se=sessOf(g);return se?se.games.findIndex(x=>x.id===g.id)+1:1};
const sessTitle=se=>`${typeLabel(se.type)}${se.type==='league'?' night':''} · ${fmtDate(se.games[0])}`;
const avgOf=gs=>gs.length?Math.round(gs.reduce((a,g)=>a+score(g).total,0)/gs.length):0;
function gamesForScope(scope){const real=done().filter(g=>!g.example),base=real.length?real:done();
 if(scope.startsWith('session:')){const se=sessions().find(x=>x.key===scope.slice(8));return se?se.games.filter(g=>g.status==='done'):[]}
 if(scope==='all'||scope.startsWith('advice-'))return base;return base.filter(g=>gameType(g)===scope)}

/* ---------- views ---------- */
function ballOptions(cur,use){const bs=arsenal().filter(b=>!use||b.use===use),names=bs.map(b=>b.name);if(cur&&!names.includes(cur))names.push(cur);
 return names.map(n=>{const b=findBall(n);return `<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}${b?(b.use==='spare'?' · spare':''):' · not in your balls'}</option>`}).join('')+`<option value="" ${cur?'':'selected'}>Not set</option>`}
function metaFields(p,m){return `<div class="field"><label>What kind of game</label><div class="seg cols">${TYPES.map(([v,l])=>`<button data-act="mtype" data-p="${p}" data-v="${v}" aria-pressed="${(m.type||'open')===v}">${l}</button>`).join('')}</div></div><div class="fields"><div class="field"><label for="${p}-center">Bowling center</label><input class="txt" id="${p}-center" data-in="${p}-center" value="${esc(m.center)}" placeholder="Lynwood Bowl" autocomplete="off"></div><div class="field"><label for="${p}-lane">Lane(s)</label><input class="txt" id="${p}-lane" data-in="${p}-lane" value="${esc(m.lane)}" placeholder="5 & 6"></div>
 <div class="field"><label for="${p}-date">Date</label><input class="txt" id="${p}-date" type="date" data-in="${p}-date" value="${esc(m.date)}"></div><div class="field"><label for="${p}-ball">Strike ball</label><select class="txt" id="${p}-ball" data-in="${p}-ball">${ballOptions(m.ball,'strike')}</select></div></div>`}
function gameHead(g,cur,sel,total){const me=state.metaEdit&&state.metaEdit.id===g.id;
 return `<section class="card"><div class="row between"><div class="grow"><p class="eyebrow">${typeLabel(gameType(g))} · game ${gameNo(g)} · ${esc(fmtDate(g))}${g.ball?' · '+esc(g.ball):''}${g.example?' · <span class="badge">Example</span>':''}</p><h3>${esc(where(g)||'Unnamed center')}</h3></div><div class="total" aria-label="Score">${total}</div></div>${sheetHTML(g,cur,sel)}
 ${me?`<div class="editbox">${metaFields('me',state.metaEdit)}<div class="row"><button class="btn primary" data-act="meta-save">Save details</button><button class="btn ghost" data-act="meta-cancel">Cancel</button></div></div>`
 :`<div class="row between"><p class="muted small grow">Tap a frame to read it or fix it.</p><button class="btn ghost small" data-act="meta-edit" data-id="${g.id}">Edit details</button></div>`}</section>`}
function entryCard(c,d,o){const pr=autoMark(c,d,o.g);return `<section class="card ${o.edit?'editing':''}"><div class="row between"><div><p class="eyebrow">${o.edit?'Editing · ':''}Frame ${c.fi+1} · ball ${c.bi+1}</p><h2>${c.fresh?'Full rack':'Spare shot'}</h2></div><span class="pill ${c.fresh?'ok':'warn'}">${c.rack.length} pin${c.rack.length>1?'s':''} up</span></div>

  <div class="field"><div class="row between"><label for="in-ball">Ball</label><button class="btn ghost small" data-act="tab" data-tab="settings">Edit balls</button></div><select id="in-ball" class="txt" data-in="ball">${ballOptions(d.ball)}</select></div>
  ${o.sug?`<div class="suggest"><div class="row between"><div class="grow"><p class="label">Ideal shot${d.ball?' · '+esc(d.ball):''}</p><p class="sugline">Stand ${o.sug.st} · aim ${o.sug.tg}</p>${o.sug.ball||o.sug.gear!==undefined?`<p class="sugextra">${[o.sug.ball?'Switch to '+esc(o.sug.ball):'',o.sug.gear!==undefined?(o.sug.gear==='slow'?'Throw it slower':o.sug.gear==='fast'?'Throw it faster':'Back to normal speed'):''].filter(Boolean).join(' · ')}</p>`:''}</div>${d.st===o.sug.st&&d.tg===o.sug.tg&&(!o.sug.ball||d.ball===o.sug.ball)&&(o.sug.gear===undefined||(d.gear||null)===o.sug.gear)?'<span class="pill ok">Set</span>':'<button class="btn small" data-act="use-sug">Use it</button>'}</div><p class="small muted">${esc(o.sug.why)}</p>${o.sug.hist?`<p class="small">${esc(o.sug.hist)}</p>`:''}</div>`:''}
  <div class="fields">${stepper('st','Stood on board',d.st)}${stepper('tg','Aimed at (arrows)',d.tg)}</div>
  ${previewHTML(c,d,o.g)}
  <div class="field"><div class="row between"><label>Did you hit your mark?</label>${pr&&d.markAuto?'<span class="pill warn">Predicted from the pins</span>':''}</div><div class="seg cols">${[['yes','Yes'],['left','Left'],['right','Right'],['unsure','Not sure']].map(([v,l])=>`<button data-act="mark" data-v="${v}" aria-pressed="${d.mark===v}">${l}</button>`).join('')}</div></div>
  ${pr&&d.markAuto?`<p class="muted small">${pr.mark==='yes'?`This is what your usual ${esc(d.ball||'')} shot on this line leaves, so it looks like you hit your mark.`:`This came in about ${Math.abs(r1(pr.dev))} boards ${pr.dev<0?'lighter':'higher'} than your usual shot on this line leaves, which points to missing ${pr.mark} ${missLbl(pr.miss)} (or a speed change). Tap what really happened if you remember.`}</p>`:''}
  ${pr&&!d.markAuto&&(pr.mark!==d.mark||(pr.miss||null)!==(d.miss||null))?`<button class="btn ghost small" data-act="mark-auto">Use the prediction: ${pr.mark==='yes'?'hit your mark':`${pr.mark} ${missLbl(pr.miss)}`}</button>`:''}
  ${d.mark==='left'||d.mark==='right'?`<div class="field"><label>How far ${d.mark}? Best guess is fine</label><div class="seg cols">${MISS.map(([v,l])=>`<button data-act="miss" data-v="${v}" aria-pressed="${(d.miss||'')===v}">${l}</button>`).join('')}</div></div>`:''}
  ${c.fresh?`<div class="field"><div class="row between"><label>Speed you're throwing on purpose</label>${d.gear&&d.gearCarried?'<span class="pill warn">Kept from your last shot</span>':''}</div><div class="seg cols">${[['','Normal'],['slow','Slower'],['fast','Faster']].map(([v,l])=>`<button data-act="gear" data-v="${v}" aria-pressed="${(d.gear||'')===v}">${l}</button>`).join('')}</div><p class="muted small">An adjustment, not a miss. It stays set for your next first balls tonight until you change it.</p></div>`:''}
  <div class="field"><label>This ball felt</label><div class="seg cols">${[['',c.fresh&&d.gear?'As planned':'Normal'],['slow','Slow'],['fast','Fast']].map(([v,l])=>`<button data-act="speed" data-v="${v}" aria-pressed="${(d.sp||'')===v}">${l}</button>`).join('')}</div></div>
  ${c.fresh?'':'<p class="muted small">Stance and target are optional on spare shots.</p>'}
  <button class="btn primary wide" data-act="saveball">${o.edit?'Save':'Save ball'} · ${leaveLabel(c,d)}</button>
  ${o.footer}</section>`}
/* Live shot picture: redraws as pins, stance, aim and miss change, so the bowler can match it to what they saw. */
const PINBOARD={1:20,2:25,3:15,4:30,5:20,6:10,7:35,8:25,9:15,10:5};
function previewHTML(c,d,g){if(d.st==null||d.tg==null)return `<p class="muted small">Add where you stood and aimed to see a picture of the shot.</p>`;
 const h=hand(g),s=BP(d.ball),th=typicalHook(d.ball),missed=d.mark==='left'||d.mark==='right',dir=missed?(((d.mark==='left')===(h==='R'))?1:-1):0;
 const [lo,hi]=d.miss==='1-2'?[1,2]:d.miss==='3-4'?[3,4]:d.miss==='5+'?[5,8]:[1,5];const side=n=>(n>0)===(h==='R')?'left':'right';
 let ax,entry,est=false,ghosts=[],cap=[],straight=false,standing=d.standing;

const TERMS={

 'Greek church':'Five pins in two groups, like 4-6-7-9-10. Named for the shape, which looks like a church with two towers.',
 'Washout':'A leave that includes the head pin, like 1-2-4-10. Not a split, because the 1 is still standing, but it is spread out.',
 'Baby split':'Two pins one row apart with a gap between, like the 2-7 or 3-10. Easier than it looks: aim between them.',
 'Split':'Two or more pins left with a gap between them and the head pin gone. Shown circled on the printout.',
 'Brooklyn':'A strike where the ball crosses to the other side of the head pin: the 1-2 pocket for a right-hander. It counts, but it means the ball came in too far left.',
 'Pocket':'Where the ball should hit for a strike: between the 1 and 3 pins for a right-hander (1 and 2 for a lefty), around board 17.',
 'Pocket hit':'A first ball that reached the pocket, whether or not every pin fell. The app reads this from the pins left: a single 10 or 7 usually means a good hit that did not carry.',

const gamesFp=gs=>gs.map(g=>g.id+':'+(g.updatedAt||g.finishedAt||'')).sort().join(',');
const planFor=scope=>(cache.plans||{})[planId(scope)]||null;
function savePlan(scope,gs,text,data){if(state.mode==='real')return;const id=planId(scope);cache.plans=cache.plans||{};cache.plansDirty=cache.plansDirty||[];const prev=cache.plans[id];
 const history=prev&&(prev.text||prev.data)?[{text:prev.text||'',data:prev.data||null,at:prev.at,games:prev.games},...(prev.history||[])].slice(0,12):[];
 cache.plans[id]={scope,text:text||'',data:data||null,at:new Date().toISOString(),games:gs.length,fp:gamesFp(gs),history};if(!cache.plansDirty.includes(id))cache.plansDirty.push(id);saveLocal();flush()}
function coachFacts(a,gs){const h=state.settings.hand==='L'?'left':'right';
 const bag=arsenal().map(b=>{const th=typicalHook(b.name);return `- ${b.name} (${b.use} ball). ${b.specs||'Specs unknown.'}${b.use==='strike'?` Laydown ${b.offset} boards inside stance, breakpoint ${b.bf} ft, hook ${th.starter?'about '+Math.round(th.v)+' boards (starting guess)':'about '+Math.round(th.v)+' boards (learned from '+th.n+' shots)'}.`:''}`}).join('\n');
 const lines=Object.entries(a.lines).map(([k,L])=>`${k}: ${L.n} shots, ${L.x} strikes, avg entry board ${r1(L.e/L.n)}`).join('; ');
 const leaves=Object.entries(a.leaves).sort((x,y)=>y[1]-x[1]).slice(0,8).map(([k,n])=>`${leaveName(k.split('-').map(Number))}: ${n}`).join('; ');
 const br=gs.filter(g=>g.debrief&&g.debrief.brooklyn!=null),brN=br.reduce((x,g)=>x+g.debrief.brooklyn,0),brS=br.reduce((x,g)=>x+firstBalls(g).filter(b=>!b.standing.length).length,0);
 return `Bowler: ${h}-handed league bowler. Boards counted from the ball-side gutter, pocket at 17.5, arrows at 5-board steps.
Bag:\n${bag}
All games (${a.games}, oldest to newest scratch scores): ${a.scores.join(', ')}. Strikes ${a.strikes}/${a.fb.length} first balls${br.length?`; the bowler reported ${brN} of ${brS} strikes in debriefed games went Brooklyn`:''}. Spares made ${a.made}/${a.opp}; single pins ${a.sMade}/${a.sOpp}.
First-ball misses read from leaves: light ${a.cls.light}, pocket ${a.cls.pocket}, high ${a.cls.high}. Remembered aim: hit mark ${a.mk.y} of ${a.mk.n}, missed left ${a.mk.left}, right ${a.mk.right}.
Lines used: ${lines||'none recorded'}. Common leaves: ${leaves||'none'}.
Spare system: 3-6-9 for left-side pins, 2-4-6 for right-side pins off the strike line; 10 pin from 32 at 15, 7 pin from 29 at 15 with the spare ball.
Entry boards and hooks are estimated from leaves, so treat small samples carefully.`}
function nightFacts(se,night){const N=(night[0]&&night[0].nightNotes)||{},h=hand(night[0]);
 const gl=night.map((g,i)=>{const fb=firstBalls(g),x=fb.filter(b=>!b.standing.length).length;return `Game ${i+1}: ${score(g).total} scratch, ${x} strikes${g.debrief&&g.debrief.brooklyn!=null?` (${g.debrief.brooklyn} went Brooklyn)`:''}. First balls in order: ${fb.map(b=>b.standing.length?keyOf(b.standing):'X').join(', ')}.${g.note?' Notes: '+g.note:''}`}).join('\n');
 const ans=[N.missSide&&`Missed the mark mostly: ${N.missSide}`,N.missWhy&&`Main cause of misses: ${N.missWhy}`,N.bestArrow&&`Best shots were crossing near board ${N.bestArrow}`,N.focus&&`What pulled focus: ${N.focus}`,N.extra&&`Other notes: ${N.extra}`].filter(Boolean).join('. ');
 return `${sessTitle(se)} at ${se.center||'the center'}.\n${gl}\nBowler's own debrief (trust this over estimates): ${ans||'not answered yet'}.`}
async function coachAll(nightKey){const all=gamesForScope('all');if(!all.length)return;
 const se=nightKey?sessions().find(x=>x.key===nightKey):sessions().find(x=>x.games.some(g=>g.status==='done')),night=se?se.games.filter(g=>g.status==='done'):[];
 let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
 if(!sample){state.coach={busy:false,err:'Live AI features aren’t on the site yet. The saved coaching here is from my real league nights.'};render();return}
 const prev=[['all','training plan'],['advice-lines','lines advice'],['advice-ball','ball advice']].map(([sc,l])=>{const p=planFor(sc);return p?`Earlier ${l} (${ymd(new Date(p.at))}): ${p.text.slice(0,500)}`:''}).filter(Boolean).join('\n');
 const prompt=`You are this bowler's coach, writing after a league night. Use everything below, but say only what matters most. The bowler's own answers about the night are more reliable than estimates from leaves.
${coachFacts(analyze(all),all)}
TONIGHT:\n${night.length?nightFacts(se,night):'No night selected.'}
${prev?`YOUR EARLIER ADVICE (say briefly what improved and what still needs work):\n${prev}`:''}
Decide what matters most for THIS bowler right now and lead with it. Do not cover every topic: pick only what will change their next night. Topics are your choice (aim and focus, line and moves, speed, spares, equipment, practice, mindset). Skip a topic entirely if there is nothing new to say. Be brief and concrete, use board numbers where useful, and mention progress against earlier advice only when it matters.
Reply with only JSON in this shape, plain text with no markdown symbols:
{"headline":"the single most important thing, one sentence","points":[{"title":"2-5 words","body":"under 45 words"}],"think":"one question for them to think about before next week, specific to tonight"}
Use 1 to 4 points, most important first. The first point should expand on the headline.`;
 state.coach={busy:true,err:''};render();
 try{const r=await sample.json(prompt,{modelTier:'default'});if(!r||typeof r!=='object')throw {code:'invalid_json'};
  if(!r.headline)throw {code:'invalid_json'};const pts=(Array.isArray(r.points)?r.points:[]).slice(0,4).map(x=>({title:String(x.title||''),body:String(x.body||'')})).filter(x=>x.body);
  const plan={headline:String(r.headline),points:pts,night:se?se.key:null,nightTitle:se?sessTitle(se):''};
  if(r.think&&night.length){const ng=clone(night[0]);ng.nightNotes={...(ng.nightNotes||{}),think:String(r.think)};persist(ng)}
  savePlan('coach',gamesForScope('all'),'',plan);
  state.coach={busy:false,err:''}}
 catch(e){state.coach={busy:false,err:e&&e.code==='not_granted'?'Claude wasn’t allowed to answer here. You can still ask in your chat.':e&&e.code==='rate_limited'?'Too many requests right now. Try again in a minute.':'Couldn’t get plans right now. Try again in a moment.'}}
 render()}
async function coach(scope){const gs=gamesForScope(scope);if(!gs.length)return;const a=analyze(gs);const night=scope.startsWith('session:');
 let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
 if(!sample){state.coach.err='Live AI features aren’t on the site yet. The saved coaching here is from my real league nights.';render();return}
 const leaves=Object.entries(a.leaves).sort((x,y)=>y[1]-x[1]).slice(0,10).map(([k,n])=>`${leaveName(k.split('-').map(Number))}: ${n}`).join('; ');
 const lines=Object.entries(a.lines).map(([k,L])=>`${k} shots ${L.n}, strikes ${L.x}, avg entry board ${r1(L.e/L.n)}`).join('; ');
 let prompt=`You are a practical bowling coach. Bowler: ${state.settings.hand==='L'?'left':'right'}-handed, boards counted from the ball-side gutter, pocket at board 17.5.
Balls: ${arsenal().map(b=>{const th=typicalHook(b.name);return `${b.name} (${b.use} ball${b.use==='strike'?`, laydown ${b.offset} inside stance, breakpoint ${b.bf} ft, hook ${th.starter?'unknown':'~'+Math.round(th.v)+' boards'}`:''})`}).join('; ')||'not recorded'}.
Data from ${a.games} games (oldest to newest scores): ${a.scores.join(', ')}.
First balls: ${a.fb.length}, strikes ${a.strikes}. Spares made ${a.made}/${a.opp}; single-pin spares ${a.sMade}/${a.sOpp}.
First-ball entry read from leaves: light ${a.cls.light}, pocket ${a.cls.pocket}, high ${a.cls.high}. Estimated median hook ${median(a.hooks)==null?'unknown':Math.round(median(a.hooks))+' boards'} (breakpoint assumed ${state.settings.bf} ft).
Hitting the target at the arrows: hit ${a.mk.y} of ${a.mk.n} marked shots, missed left ${a.mk.left}, missed right ${a.mk.right}. Hook spread (std dev) ${a.hooks.length>=3?Math.round(sd(a.hooks))+' boards':'unknown'}. Note: only stance and pins are certain; entry board is inferred from the leave and hook is estimated.
Most common leaves: ${leaves||'none'}.
Planned speed changes: ${(()=>{const fb=gs.flatMap(g=>firstBalls(g)).filter(b=>b.gear);if(!fb.length)return 'none';const by={};fb.forEach(b=>{const o=by[b.gear]||(by[b.gear]={n:0,x:0});o.n++;if(!b.standing.length)o.x++});return Object.entries(by).map(([k,o])=>`${k==='slow'?'slower':'faster'} on purpose for ${o.n} first balls, ${o.x} strikes`).join('; ')})()}.
Stance → target lines used: ${lines||'not recorded'}.
${night?`These games are one ${typeLabel(gameType(gs[0])).toLowerCase()} night, games in order. Focus on what happened tonight (how the lane changed between games, whether adjustments came too late) and what to bring to next week.`:''}
Write a short training plan in plain text, no markdown symbols, under 260 words. Use these sections with a plain heading line each: What the data says (2-3 sentences naming the clearest pattern), Line adjustment (specific board moves using the 2-and-1 rule), Spare work (which spares to practice and how), Drills for next practice (3 numbered drills with reps). Be concrete and say when the sample is too small to be sure.`;
 if(scope.startsWith('advice-'))prompt=advicePrompt(scope,a,gs);
 state.coach={busy:true,text:'',err:'',scope};render();const outId='coach-out-'+scope.replace(/[^a-z0-9]/gi,'');
 try{const res=await sample(prompt,{onText:({text})=>{state.coach.text=text;const el=document.getElementById(outId);if(el)el.textContent=text}});state.coach.text=res.text;if(res.text&&!res.truncated)savePlan(scope,gs,res.text)}
 catch(e){state.coach.err=e&&e.code==='not_granted'?'Claude wasn’t allowed to answer here. You can still ask in your chat.':e&&e.code==='rate_limited'?'Too many requests right now. Try again in a minute.':'Couldn’t get a plan right now. Try again in a moment.';if(e&&e.text)state.coach.text=e.text}
 state.coach.busy=false;render()}

async function init(){
 state.mode=new URLSearchParams(location.search).get('mode')==='sandbox'?'sandbox':'real';
 try{SNAP=await (await fetch('/pocket-log/snapshot.json',{cache:'no-cache'})).json()}catch(e){SNAP={games:[],settings:{},plans:{}}}
 if(state.mode==='real')fromSnap();
 else{loadLocal();if(!Object.keys(cache.games).length&&!cache.settings){fromSnap();cache.settings=clone(state.settings);saveLocal()}
  if(!cache.plans||!Object.keys(cache.plans).length)cache.plans=clone(SNAP.plans||{})}
 state.tab=state.mode==='real'?'history':'bowl';state.loaded=true;render()}
init();
})();
